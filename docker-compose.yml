services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: freescout-app
    container_name: freescout-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8080" # Local only — Cloudflare Tunnel handles public traffic
    environment:
      - PUID=1000
      - PGID=1000
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPCACHE_ENABLE=1
      - PHP_POST_MAX_SIZE=20M
      - PHP_UPLOAD_MAX_FILESIZE=20M
      - XDEBUG_MODE=off
      - XDEBUG_START_WITH_REQUEST=trigger
      - XDEBUG_CLIENT_HOST=host.docker.internal
      - XDEBUG_CLIENT_PORT=9003
      - XDEBUG_DISCOVER_CLIENT_HOST=1
      - XDEBUG_IDEKEY=VSCODE
      # Force DB connection to use container networking
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-freescout}
      - DB_USERNAME=${DB_USERNAME:-freescout}
      - DB_PASSWORD=${DB_PASSWORD:-0ac1213576dceeefa1bcb5bc53d6973d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volumes: prevent storage/ and bootstrap/cache/ permission drift
      # when www-data writes in-container vs. your local user on the host.
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - freescout-net
    healthcheck:
      test: [ "CMD", "curl", "-fk", "https://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mariadb:10.6
    container_name: freescout-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-e2f047492902de12c4e5b672ae850181}
      MARIADB_DATABASE: ${DB_DATABASE:-freescout}
      MARIADB_USER: ${DB_USERNAME:-freescout}
      MARIADB_PASSWORD: ${DB_PASSWORD:-0ac1213576dceeefa1bcb5bc53d6973d}
    ports:
      - "127.0.0.1:3307:3306" # Local access only — do not expose DB to the network
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - freescout-net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: freescout-redis
    restart: unless-stopped
    networks:
      - freescout-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: freescout-app
    container_name: freescout-queue
    restart: always
    command: php artisan queue:work --queue=emails,default,long-running --sleep=3 --tries=3 --max-time=3600
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPCACHE_ENABLE=1
      # Force DB connection to use container networking
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-freescout}
      - DB_USERNAME=${DB_USERNAME:-freescout}
      - DB_PASSWORD=${DB_PASSWORD:-0ac1213576dceeefa1bcb5bc53d6973d}
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - app
      - db
      - redis
    networks:
      - freescout-net
    healthcheck:
      disable: true

  cron:
    image: freescout-app
    container_name: freescout-cron
    restart: unless-stopped
    command: >
      /bin/sh -c ' while true; do
        cd /var/www/html && php artisan schedule:run >> /var/log/cron.log 2>&1;
        sleep 60;
      done '
    environment:
      # Force DB connection to use container networking
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-freescout}
      - DB_USERNAME=${DB_USERNAME:-freescout}
      - DB_PASSWORD=${DB_PASSWORD:-0ac1213576dceeefa1bcb5bc53d6973d}
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - app
      - db
      - redis
    networks:
      - freescout-net
    healthcheck:
      disable: true

  reverb:
    image: freescout-app
    container_name: freescout-reverb
    restart: unless-stopped
    command: >
      sh -c ' while [ ! -f /var/www/html/vendor/autoload.php ]; do
        echo "Waiting for dependencies...";
        sleep 5;
      done; php artisan config:clear; php artisan reverb:start --host=0.0.0.0 --port=8080 '
    environment:
      # Force DB connection to use container networking
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-freescout}
      - DB_USERNAME=${DB_USERNAME:-freescout}
      - DB_PASSWORD=${DB_PASSWORD:-0ac1213576dceeefa1bcb5bc53d6973d}
    ports:
      - "6001:8080"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - app
      - db
      - redis
    networks:
      - freescout-net
    healthcheck:
      disable: true

networks:
  freescout-net:
    driver: bridge

volumes:
  db_data: # storage_data: persists uploads, logs, and framework cache independently of source code

  storage_data: # bootstrap_cache: persists compiled config/routes/views between container restarts

  bootstrap_cache:

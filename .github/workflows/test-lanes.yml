name: Test & Guard (MySQL)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'
  DB_CONNECTION: testing

jobs:
  # ====================================================================
  # LANE 1: GUARDS (Fast - 30-60 seconds)
  # Purpose: Block obvious violations before expensive test runs
  # ====================================================================
  guards:
    name: 🛡️ Guards & Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction --no-dev

      - name: 🔒 Architecture Compliance
        run: bash scripts/ci/check-architecture-compliance.sh
        continue-on-error: false

      - name: 📦 Module Isolation Guard
        run: |
          php artisan test tests/Unit/ModuleUnitIsolationGuardTest.php \
                           tests/Unit/RefreshDatabaseUsageGuardTest.php \
                           --parallel --processes=10 -q
        continue-on-error: false

  # ====================================================================
  # LANE 2: UNIT TESTS (15-30 seconds)
  # Purpose: Fast feedback on logic-level coverage
  # ====================================================================
  unit-tests:
    name: ✅ Unit Tests
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Run Unit Tests
        run: |
          php artisan test tests/Unit \
                   --parallel --processes=10 \
                   --exclude=tests/Unit/ModuleUnitIsolationGuardTest.php,tests/Unit/RefreshDatabaseUsageGuardTest.php \
                   --coverage-clover=reports/unit-coverage.xml
        continue-on-error: false

      - name: 📊 Upload Unit Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/unit-coverage.xml
          flags: unit
          name: unit-coverage
        if: always()

  # ====================================================================
  # LANE 3: FEATURE TESTS (30-60 seconds)
  # Purpose: Integration with DB, controllers, requests
  # ====================================================================
  feature-tests:
    name: 🧪 Feature Tests
    runs-on: ubuntu-latest
    needs: guards
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freescout-test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Setup Database
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: freescout-test
        run: |
          php artisan migrate --force -n --database=testing
          php artisan db:seed --force -n --database=testing

      - name: Run Feature Tests
        run: |
          php artisan test tests/Feature \
                   --parallel --processes=10 \
                   --coverage-clover=reports/feature-coverage.xml
        continue-on-error: false

      - name: 📊 Upload Feature Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/feature-coverage.xml
          flags: feature
          name: feature-coverage
        if: always()

  # ====================================================================
  # LANE 4: ARCHITECTURE TESTS (5-10 seconds)
  # Purpose: Deeper module boundary and contract validation
  # ====================================================================
  architecture-tests:
    name: 🏗️ Architecture Tests
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Run Architecture Tests
        run: |
          php artisan test tests/Architecture \
                   --parallel --processes=10 -q
        continue-on-error: false

  # ====================================================================
  # LANE 5: INTEGRATION TESTS (30-60 seconds)
  # Purpose: External APIs, services, module integration
  # ====================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: guards
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freescout-test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Setup Database
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: freescout-test
        run: |
          php artisan migrate --force -n --database=testing
          php artisan db:seed --force -n --database=testing

      - name: Run Integration Tests
        run: |
          php artisan test tests/Integration \
                   --parallel --processes=10
        continue-on-error: false

  # ====================================================================
  # SUMMARY: Report results
  # ====================================================================
  test-results:
    name: 📈 Test Summary
    runs-on: ubuntu-latest
    needs: [guards, unit-tests, feature-tests, architecture-tests, integration-tests]
    if: always()
    steps:
      - name: ✅ All Tests Passed
        if: needs.guards.result == 'success' && needs.unit-tests.result == 'success' && needs.feature-tests.result == 'success' && needs.architecture-tests.result == 'success' && needs.integration-tests.result == 'success'
        run: echo "✅ All test lanes passed!"

      - name: ❌ Tests Failed
        if: failure()
        run: |
          echo "❌ One or more test lanes failed. Check the logs above."
          exit 1

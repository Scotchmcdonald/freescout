name: Test & Guard (MySQL)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'
  APP_ENV: testing
  APP_DEBUG: 'true'
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array

jobs:
  # ====================================================================
  # LANE 1: GUARDS (Fast - 30-60 seconds)
  # Purpose: Block obvious violations before expensive test runs
  # ====================================================================
  guards:
    name: 🛡️ Guards & Compliance
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: 🔒 Architecture Compliance
        run: bash scripts/ci/check-architecture-compliance.sh
        continue-on-error: false

      - name: 📦 Module Isolation Guard
        run: |
          php artisan test tests/Unit/ModuleUnitIsolationGuardTest.php --parallel --processes=10 -q
          php artisan test tests/Unit/RefreshDatabaseUsageGuardTest.php --parallel --processes=10 -q
        continue-on-error: false

      - name: Upload Guard Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-reports
          path: |
            reports/ci_master.log
            reports/test-results-latest.log
          if-no-files-found: ignore

  # ====================================================================
  # LANE 2: UNIT TESTS (15-30 seconds)
  # Purpose: Fast feedback on logic-level coverage
  # ====================================================================
  unit-tests:
    name: ✅ Unit Tests
    runs-on: ubuntu-latest
    needs: guards
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Run Unit Tests
        run: |
          php artisan test tests/Unit \
                   --parallel --processes=10 \
                   --coverage-clover=reports/unit-coverage.xml
        continue-on-error: false

      - name: 📊 Upload Unit Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/unit-coverage.xml
          flags: unit
          name: unit-coverage
        if: always()

      - name: Upload Unit Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            reports/unit-coverage.xml
            reports/test-results-latest.log
          if-no-files-found: ignore

  # ====================================================================
  # LANE 3: FEATURE TESTS (30-60 seconds)
  # Purpose: Integration with DB, controllers, requests
  # ====================================================================
  feature-tests:
    name: 🧪 Feature Tests
    runs-on: ubuntu-latest
    needs: guards
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: freescout-test
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freescout-test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json
          coverage: pcov

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Safety Check (Must Use Non-Production DB)
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          if [[ "$DB_HOST" != "127.0.0.1" && "$DB_HOST" != "mysql" ]]; then
            echo "DB_HOST must be local mysql service; refusing to run migrations."
            exit 1
          fi
          if [[ "$DB_DATABASE" != *test* ]]; then
            echo "DB_DATABASE must include 'test'; refusing to run migrations."
            exit 1
          fi

      - name: Setup Database
        run: |
          php artisan migrate --force -n --database=mysql
          php artisan db:seed --force -n --database=mysql

      - name: Run Feature Tests
        run: |
          php artisan test tests/Feature \
                   --parallel --processes=10 \
                   --coverage-clover=reports/feature-coverage.xml
        continue-on-error: false

      - name: 📊 Upload Feature Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/feature-coverage.xml
          flags: feature
          name: feature-coverage
        if: always()

      - name: Upload Feature Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-reports
          path: |
            reports/feature-coverage.xml
            reports/test-results-latest.log
          if-no-files-found: ignore

  # ====================================================================
  # LANE 4: ARCHITECTURE TESTS (5-10 seconds)
  # Purpose: Deeper module boundary and contract validation
  # ====================================================================
  architecture-tests:
    name: 🏗️ Architecture Tests
    runs-on: ubuntu-latest
    needs: guards
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Run Architecture Tests
        run: |
          php artisan test tests/Architecture \
                   --parallel --processes=10 -q
        continue-on-error: false

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-reports
          path: reports/test-results-latest.log
          if-no-files-found: ignore

  # ====================================================================
  # LANE 5: INTEGRATION TESTS (30-60 seconds)
  # Purpose: External APIs, services, module integration
  # ====================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: guards
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: freescout-test
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freescout-test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json
          coverage: pcov

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Safety Check (Must Use Non-Production DB)
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          if [[ "$DB_HOST" != "127.0.0.1" && "$DB_HOST" != "mysql" ]]; then
            echo "DB_HOST must be local mysql service; refusing to run migrations."
            exit 1
          fi
          if [[ "$DB_DATABASE" != *test* ]]; then
            echo "DB_DATABASE must include 'test'; refusing to run migrations."
            exit 1
          fi

      - name: Setup Database
        run: |
          php artisan migrate --force -n --database=mysql
          php artisan db:seed --force -n --database=mysql

      - name: Run Integration Tests
        run: |
          php artisan test tests/Integration \
                   --parallel --processes=10
        continue-on-error: false

      - name: Upload Integration Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: reports/test-results-latest.log
          if-no-files-found: ignore

  # ====================================================================
  # SUMMARY: Report results
  # ====================================================================
  test-results:
    name: 📈 Test Summary
    runs-on: ubuntu-latest
    needs: [guards, unit-tests, feature-tests, architecture-tests, integration-tests]
    if: always()
    steps:
      - name: ✅ All Tests Passed
        if: needs.guards.result == 'success' && needs.unit-tests.result == 'success' && needs.feature-tests.result == 'success' && needs.architecture-tests.result == 'success' && needs.integration-tests.result == 'success'
        run: echo "✅ All test lanes passed!"

      - name: ❌ Tests Failed
        if: failure()
        run: |
          echo "❌ One or more test lanes failed. Check the logs above."
          exit 1

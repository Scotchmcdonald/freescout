name: Test App (PostgreSQL)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test App (PostgreSQL)
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: freescout-test
      DB_USERNAME: freescout-test
      DB_PASSWORD: freescout-test

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: freescout-test
          POSTGRES_PASSWORD: freescout-test
          POSTGRES_DB: freescout-test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, xml, imap, zip, gd, curl, intl, json

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Safety Check (Must Use Non-Production DB)
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "pgsql"
          if [[ "$DB_HOST" != "127.0.0.1" && "$DB_HOST" != "localhost" && "$DB_HOST" != "postgres" ]]; then
            echo "DB_HOST must be local postgres service; refusing to run migrations."
            exit 1
          fi
          if [[ "$DB_DATABASE" != *test* ]]; then
            echo "DB_DATABASE must include 'test'; refusing to run migrations."
            exit 1
          fi

      - name: Migrate and seed the database
        run: |
          php${{ matrix.php }} artisan migrate --force -n --database=pgsql
          php${{ matrix.php }} artisan db:seed --force -n --database=pgsql
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Run PHP tests
        if: ${{ matrix.php < 8.4 }}
        run: php${{ matrix.php }} ./vendor/bin/phpunit
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}

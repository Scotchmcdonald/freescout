name: 🧬 Mutation Testing (Tier 2) - Manual

on:
  workflow_dispatch:

jobs:
  mutation-testing:
    name: Tier 2 Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: xdebug,sqlite3,pdo_sqlite
          ini-values: |
            memory_limit=3G
            max_execution_time=300
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          mkdir -p storage/infection
          mkdir -p reports

      - name: 📋 Phase 1: Run test suite (parallel, no coverage)
        run: |
          echo "Running 6253 tests in parallel (10 workers)..."
          ./vendor/bin/pest --parallel --processes=10
        timeout-minutes: 15

      - name: 📋 Phase 2: Collect coverage (sequential)
        run: |
          echo "Collecting code coverage..."
          XDEBUG_MODE=coverage php -d memory_limit=3G ./vendor/bin/pest \
            --coverage-xml=storage/infection/coverage \
            --coverage-text=reports/coverage-final.txt
        timeout-minutes: 15

      - name: 📋 Phase 3: Run mutation testing (Tier 2)
        run: |
          echo "Running mutation testing (app/Services scope)..."
          bash scripts/ci/check-mutation-tier2.sh
        timeout-minutes: 50

      - name: 📊 Mutation Results Summary
        if: always()
        run: |
          if [ -f reports/infection-extended-summary.log ]; then
            echo "## 🧬 Mutation Testing Summary"
            cat reports/infection-extended-summary.log
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: reports/coverage-*
          retention-days: 7

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mutation-results
          path: |
            reports/infection-extended*
            storage/infection/
          retention-days: 7

      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read mutation summary
            const summaryPath = 'reports/infection-extended-summary.log';
            let summary = '';

            if (fs.existsSync(summaryPath)) {
              summary = fs.readFileSync(summaryPath, 'utf8');
            }

            // Try to read coverage report
            const coveragePath = 'reports/coverage-final.txt';
            let coverage = '';

            if (fs.existsSync(coveragePath)) {
              const lines = fs.readFileSync(coveragePath, 'utf8').split('\n');
              coverage = lines.slice(0, 5).join('\n');
            }

            const comment = `## 🧬 Testing Results

### ✅ Mutation Testing (Tier 2)
\`\`\`
${summary || 'See artifacts for details'}
\`\`\`

### 📊 Code Coverage
\`\`\`
${coverage || 'See artifacts for details'}
\`\`\`

**Report Links:**
- [Coverage Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
- [Mutation Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            }).catch(err => console.log('Could not comment on PR (may not have permission)'));

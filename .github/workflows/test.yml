name: Test App (MySQL)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test App (MySQL)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: freescout-test
      DB_USERNAME: freescout-test
      DB_PASSWORD: freescout-test
    strategy:
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysql, mbstring, xml, imap, zip, gd, curl, intl, json

      - name: Start MySQL
        run: |
          sudo systemctl start mysql

      - name: Setup database
        run: |
          mysql -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS `freescout-test`;'
          mysql -uroot -proot -e "CREATE USER 'freescout-test'@'localhost' IDENTIFIED WITH mysql_native_password BY 'freescout-test';"
          mysql -uroot -proot -e "GRANT ALL ON \`freescout-test\`.* TO 'freescout-test'@'localhost';"
          mysql -uroot -proot -e 'FLUSH PRIVILEGES;'

      - name: Install composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction

      - name: Safety Check (Must Use Non-Production DB)
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          if [[ "$DB_HOST" != "127.0.0.1" && "$DB_HOST" != "localhost" && "$DB_HOST" != "mysql" ]]; then
            echo "DB_HOST must be local mysql service; refusing to run migrations."
            exit 1
          fi
          if [[ "$DB_DATABASE" != *test* ]]; then
            echo "DB_DATABASE must include 'test'; refusing to run migrations."
            exit 1
          fi

      - name: Migrate and seed the database
        run: |
          php${{ matrix.php }} artisan migrate --force -n --database=mysql
          php${{ matrix.php }} artisan db:seed --force -n --database=mysql

      - name: Run PHP tests
        if: ${{ matrix.php < 8.4 }}
        run: php${{ matrix.php }} ./vendor/bin/phpunit
